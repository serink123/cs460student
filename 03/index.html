<html>
  <head>
    <style>
      html, body { 
        background-color:#000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden !important;  
      }
    </style>
    
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>

    <script type="module">

      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';      

      var renderer, controls, scene, camera, LASTOBJECT;
      var is_scaling = false;
      var FLICKERING = false;
      var WIREFRAME = false;
      var TORUSES = [];

      window.onload = function() {

        // Three.js code goes here
        scene = new THREE.Scene();

        // setup the camera
        var fov = 75;
        var ratio = window.innerWidth / window.innerHeight;
        var zNear = 1;
        var zFar = 10000;
        camera = new THREE.PerspectiveCamera( fov, ratio, zNear, zFar );
        camera.position.set(0, 0, 100);

        // create renderer and setup the canvas
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize( window.innerWidth, window.innerHeight );
        document.body.appendChild( renderer.domElement );



        renderer.domElement.onmousedown = function( e ){
          
            if ( e.shiftKey ) {

              controls.enabled = false;

              console.log('Yay! We clicked!');

              var pixel_coords = new THREE.Vector2( e.clientX, e.clientY );

              console.log('Pixel coords', pixel_coords);

              var vp_coords = new THREE.Vector2( 
                          ( pixel_coords.x / window.innerWidth ) * 2 - 1,  //X
                          -( pixel_coords.y / window.innerHeight ) * 2 + 1) // Y

              console.log('Viewport coords', vp_coords);

              var vp_coords_near = new THREE.Vector3( vp_coords.x, vp_coords.y, 0);


              var raycaster = new THREE.Raycaster();
              raycaster.setFromCamera(vp_coords_near, camera);
              var intersects = raycaster.intersectObject(invisible_plane);

              if (intersects.length > 0) {
                console.log('Ray to Invisible Plane', intersects[0].point);

                var new_torus = new THREE.Mesh( geometry, hotpink_material.clone() );
                new_torus.position.set(intersects[0].point.x, intersects[0].point.y, intersects[0].point.z);
                new_torus.material.wireframe = WIREFRAME;
                scene.add( new_torus );

                LASTOBJECT = new_torus;
                is_scaling = true;
                TORUSES.push( new_torus );
              }

            }

          };

        renderer.domElement.onmouseup = function( e ){
          controls.enabled = true;
          is_scaling = false;
        };

        renderer.domElement.onmousemove = function( e ){

          if ( is_scaling && LASTOBJECT ) {

            console.log('movementY:', e.movementY);

            var DELTA = -e.movementY * 0.01;

            LASTOBJECT.scale.set(
              LASTOBJECT.scale.x + DELTA,
              LASTOBJECT.scale.y + DELTA,
              LASTOBJECT.scale.z + DELTA
            );

            // Switch to grassgreen when scale crosses zero (negative), back to hotpink when positive
            if ( LASTOBJECT.scale.x < 0 ) {
              LASTOBJECT.material.color.set( 0x7cfc00 ); // grassgreen (#7CFC00)
            } else {
              LASTOBJECT.material.color.set( 0xff69b4 ); // hotpink (#FF69B4)
            }

          }

        };


        // setup lights
        var ambientLight = new THREE.AmbientLight();
        scene.add( ambientLight );

        var light = new THREE.DirectionalLight( 0xffffff, 5.0 );
        light.position.set( 10, 100, 10 );
        scene.add( light );

        // configure torus knot
        var geometry = new THREE.TorusKnotGeometry( 10, 3, 100, 16 );
        var material = new THREE.MeshStandardMaterial({ color: 0xffff00 });

        var torus = new THREE.Mesh( geometry, material );

        scene.add( torus );
        LASTOBJECT = torus;
        TORUSES.push( torus );

        // hotpink material for placed toruses (0xff69b4)
        var hotpink_material = new THREE.MeshStandardMaterial({ color: 0xff69b4, side: THREE.DoubleSide });



        //
        // The invisible plane
        //
        var plane_geometry = new THREE.PlaneGeometry( 10000, 10000 );
        var plane_material = new THREE.MeshBasicMaterial( {
          visible: false
        });

        var invisible_plane = new THREE.Mesh( plane_geometry, plane_material );

        scene.add( invisible_plane );
        //
        //
        //



        // interaction
        controls = new OrbitControls( camera, renderer.domElement );

        // Toggle flickering on 'f' key press and wireframe on 'w' key press
        window.onkeypress = function( e ){
          if ( e.key === 'f' || e.key === 'F' ) {
            FLICKERING = !FLICKERING;

            if ( !FLICKERING ) {
              // reset opacity when flickering stops
              for ( var i = 0; i < TORUSES.length; i++ ) {
                TORUSES[i].material.opacity = 1.0;
                TORUSES[i].material.transparent = false;
                TORUSES[i].material.needsUpdate = true;
              }
            }
          }

          if ( e.key === 'w' || e.key === 'W' ) {
            WIREFRAME = !WIREFRAME;
            for ( var i = 0; i < TORUSES.length; i++ ) {
              TORUSES[i].material.wireframe = WIREFRAME;
            }
          }
        };

        // call animation/rendering loop
        animate();
        
      };

      function animate() {

        requestAnimationFrame( animate );

        // and here..
        controls.update();

        if ( FLICKERING ) {
          for ( var i = 0; i < TORUSES.length; i++ ) {
            TORUSES[i].material.transparent = true;
            TORUSES[i].material.opacity = Math.random();
            TORUSES[i].material.needsUpdate = true;
          }
        }

        renderer.render( scene, camera );
        
      };
    </script>
  </head>
  <body></body>
</html>
